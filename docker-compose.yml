version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: labelguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: labelguard
      POSTGRES_PASSWORD: labelguard_dev
      POSTGRES_DB: labelguard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelguard -d labelguard_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labelguard-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://labelguard:labelguard_dev@db:5432/labelguard_db
      SECRET_KEY: docker_dev_secret_key_change_in_production
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/uploads
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - evidence_uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  evidence_uploads:
