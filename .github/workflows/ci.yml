name: CI

on:
  push:
    branches: [main]
  pull_request:

# Everything here runs on free, CPU-only GitHub runners.
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Lets the simultaneous-notice race test run against real row locks.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: labelguard
          POSTGRES_PASSWORD: labelguard_dev
          POSTGRES_DB: labelguard_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U labelguard -d labelguard_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://labelguard:labelguard_dev@localhost:5432/labelguard_db
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: System libraries (barcode decoding)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build
